[project]
name = "academic-summarizer"
version = "1.0.0"
description = "Django app that turns academic PDFs into structured AI summaries via the Groq API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Samandar Hamrayev" }]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "DJ",  # flake8-django
    "SIM", # flake8-simplify
    "S",   # flake8-bandit
    "RUF", # ruff-specific
]
ignore = [
    "RUF001", # ambiguous unicode in strings (multilingual prompts are intentional)
    "RUF012", # mutable class attrs are idiomatic in Django Meta/admin
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["academic_summarizer", "papers", "summarizer"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "academic_summarizer.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:PyPDF2.*"]

[tool.coverage.run]
source = ["academic_summarizer", "papers", "summarizer"]
omit = ["*/migrations/*", "*/asgi.py", "*/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
