{% extends 'base.html' %}

{% block title %}Link Expired — Academic Summarizer{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center py-5">
      <i class="bi bi-link-45deg fs-1 text-muted mb-3 d-block"></i>
      <h2 class="fw-bold mb-2">Link no longer valid</h2>
      <p class="text-muted mb-4">
        This shared summary link has expired or been revoked by its owner.
      </p>
      <a href="{% url 'home' %}" class="btn btn-primary px-4">
        <i class="bi bi-house me-2"></i>Go to Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
