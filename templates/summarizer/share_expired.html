{% extends 'base.html' %}

{% block title %}Link expired — Academic Summarizer{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center" style="margin-top: 64px;">
    <div class="col-md-6 col-lg-5">
      <div class="section-card" style="text-align: center;">
        <i class="bi bi-link-45deg" style="font-size: 2.4rem; color: var(--text-3); display:block; margin-bottom: 16px;"></i>
        <h2>Link no longer valid</h2>
        <p style="color: var(--text-2); margin-bottom: 24px;">
          This shared summary link has expired or been revoked by its owner.
        </p>
        <a href="{% url 'home' %}" class="btn btn-violet">
          <i class="bi bi-house"></i>Go to home
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
