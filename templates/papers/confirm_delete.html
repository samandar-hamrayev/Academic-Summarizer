{% extends 'base.html' %}

{% block title %}Delete paper — Academic Summarizer{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center" style="margin-top: 48px;">
    <div class="col-md-6 col-lg-5">
      <div class="section-card" style="text-align: center;">
        <i class="bi bi-exclamation-triangle-fill" style="color: var(--rose); font-size: 2.4rem; display:block; margin-bottom: 16px;"></i>
        <h2 style="margin-bottom: 8px;">Delete paper?</h2>
        <p style="color: var(--text-2); margin-bottom: 24px;">
          Are you sure you want to delete<br>
          "<strong style="color: var(--text-0);">{{ object.title }}</strong>"?
        </p>
        <p class="meta" style="color: var(--text-3); margin-bottom: 24px;">
          This will also delete the associated summary and cannot be undone.
        </p>
        <form method="post" style="display:flex; justify-content:center; gap: 10px;">
          {% csrf_token %}
          <a href="{% url 'papers:detail' object.pk %}" class="btn btn-tech">
            Cancel
          </a>
          <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash"></i>Yes, delete
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
