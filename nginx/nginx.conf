upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 55M;   # slightly above Django's MAX_UPLOAD_MB (50)
    keepalive_timeout 65;

    # Static files are served by WhiteNoise with far-future cache headers and
    # pre-compressed variants; uploaded PDFs are only reachable through the
    # owner-checked /papers/<id>/download/ view, so /media/ is never exposed.

    # nginx's own liveness probe (does not touch Django)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location / {
        proxy_pass         http://django;
        # $http_host keeps the port, so Django's CSRF origin check works when
        # nginx is published on a non-default port.
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout  10s;
        proxy_send_timeout    180s;   # generous for AI summarization
        proxy_read_timeout    180s;   # keep in sync with GUNICORN_TIMEOUT
    }
}
