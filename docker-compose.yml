# Production-like stack: PostgreSQL + Django (gunicorn) + nginx.
#   cp .env.example .env   # set SECRET_KEY, POSTGRES_PASSWORD, GROQ_API_KEY
#   docker compose up -d --build
# Then open http://localhost:${HTTP_PORT:-8080}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academic_summarizer}
      POSTGRES_USER: ${POSTGRES_USER:-django}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]

  web:
    build: .
    image: academic-summarizer:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-django}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-academic_summarizer}
      TRUST_PROXY_HEADERS: "True"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    # Healthcheck is defined in the Dockerfile (GET /healthz/ checks the DB).
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [backend]

volumes:
  postgres_data:
  media_data:

networks:
  backend:
