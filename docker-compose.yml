services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: academic_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-academic_summarizer}
      POSTGRES_USER:     ${POSTGRES_USER:-django}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-django_secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-django} -d ${POSTGRES_DB:-academic_summarizer}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  # ── Django (Gunicorn) ───────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: academic_web
    restart: unless-stopped
    env_file: .env
    environment:
      # Override DATABASE_URL to point at the 'db' service
      DATABASE_URL: postgres://${POSTGRES_USER:-django}:${POSTGRES_PASSWORD:-django_secret}@db:5432/${POSTGRES_DB:-academic_summarizer}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    expose:
      - "8000"

  # ── Nginx (reverse proxy + static/media) ────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: academic_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web
    networks:
      - frontend

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  media_data:
  static_data:

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  backend:
  frontend:
