# Development: source mounted for hot reload, Django's runserver, SQLite.
#   docker compose -f docker-compose.dev.yml up --build
# Then open http://localhost:${DEV_PORT:-8001}

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - path: .env
        required: false
    environment:
      DEBUG: "True"
      DATABASE_URL: "sqlite:////app/media/dev.sqlite3"
    ports:
      - "127.0.0.1:${DEV_PORT:-8001}:8000"
    volumes:
      - .:/app
      - dev_media:/app/media   # keeps uploads and the SQLite DB out of the repo

volumes:
  dev_media:
